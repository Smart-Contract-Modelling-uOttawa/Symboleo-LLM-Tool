[project]
name = "symboleo-llm-tool"
version = "0.1.0"
description = "LLM-assisted SymboleoAC contract generation and correction"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "litellm>=1.0",
    "langsmith>=0.1",
    "jinja2>=3.1",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    # ruff is pinned by uv.lock and enforced with `uv sync --locked` in CI: a
    # formatter's version-dependent output would otherwise redden unrelated PRs.
    "ruff>=0.4",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    # Declared even though litellm already pulls it in transitively: the config
    # schema tests import it directly, and a transitive dep can vanish in a
    # litellm bump without our lockfile noticing the loss.
    "jsonschema>=4.0",
]
# mypy is deliberately NOT a locked dependency. A type-checker's drift surfaces
# real bugs worth adopting, unlike a formatter's, so CI runs it live via
# `uv run --with mypy` (see .github/workflows/python.yml). Its config lives in
# [tool.mypy] below and is version-independent.

[project.scripts]
symboleo-tool = "symboleo_llm_tool.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["symboleo_llm_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that call real external APIs (deselect with -m 'not live')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The judge INSTRUCTIONS string must stay byte-identical to the calibrated
# payloads (see output/fidelity.py) — rewrapping it to satisfy E501 would
# de-calibrate the instrument, so line length is exempt in this one file.
"symboleo_llm_tool/output/fidelity.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
