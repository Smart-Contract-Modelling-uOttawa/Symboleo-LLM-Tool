[project]
name = "symboleo-llm-tool"
version = "0.1.0"
description = "LLM-assisted SymboleoAC contract generation and correction"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "litellm>=1.0",
    "langsmith>=0.1",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.scripts]
symboleo-tool = "symboleo_llm_tool.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["symboleo_llm_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that call real external APIs (deselect with -m 'not live')",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
