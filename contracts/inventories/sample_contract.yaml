# Clause inventory: contracts/sample_contract.txt (curated 2026-08-11).
contract: sample_contract
source: contracts/sample_contract.txt
items:
  - id: sell
    kind: obligation
    clause: "1.1"
    expects: >
      Seller is obliged to sell the specified quantity of the specified
      quality of goods to the Buyer.
  - id: title_transfer
    kind: state
    clause: "1.2"
    expects: >
      Title/ownership of the goods passes to the Buyer only upon payment in
      full — not on delivery.
  - id: delivery
    kind: obligation
    clause: "1.3"
    expects: >
      Seller is obliged to deliver the goods within the specified number of
      days of the effective date — enforced by a temporal predicate, not
      merely a named date.
  - id: payment
    kind: obligation
    clause: "1.4"
    expects: >
      Buyer is obliged to pay the specified amount in the specified currency
      within the specified number of days OF DELIVERY — the deadline is
      relative to delivery, enforced by a temporal predicate.
  - id: late_fee
    kind: obligation
    clause: "1.5"
    expects: >
      On late payment, the Buyer is obliged to pay a late fee of the
      specified rate applied to the amount owed — triggered by the payment
      failure, not unconditional.
  - id: suspension
    kind: power
    clause: "1.5"
    expects: >
      On late payment the Seller MAY suspend its delivery obligations until
      all amounts owed are paid in full — discretionary, so a power that
      suspends the delivery obligation(s).
  - id: resumption
    kind: power
    clause: "1.6"
    expects: >
      If the Buyer pays all outstanding amounts while delivery is suspended,
      the Buyer is entitled to obtain resumption of delivery — a
      buyer-held entitlement conditioned on full payment during suspension.
  - id: termination
    kind: power
    clause: "2.1"
    expects: >
      The Buyer MAY terminate the agreement if the Seller fails to deliver —
      discretionary buyer power triggered by delivery failure (not by
      successful delivery).
