# Clause inventory: contracts/MeatSale.txt (curated 2026-08-11).
# NB distinct from sample_contract: absolute payment date, no resumption
# clause, adds the assignment prohibition and the 10-day termination grace
# (the clause the 2026-07 audit found missing from the corpus example).
contract: meatsale
source: contracts/MeatSale.txt
items:
  - id: sell
    kind: obligation
    clause: "1.1"
    expects: >
      Seller is obliged to sell the specified amount of meat of the specified
      quality to the Buyer.
  - id: title_transfer
    kind: state
    clause: "1.2"
    expects: >
      Title in the goods passes to the Buyer only when the amount owed has
      been paid in full — not on delivery.
  - id: delivery
    kind: obligation
    clause: "1.3"
    expects: >
      Seller is obliged to deliver the order in one delivery within the
      specified number of days, at the Buyer's warehouse — enforced by a
      temporal predicate.
  - id: payment
    kind: obligation
    clause: "1.4"
    expects: >
      Buyer is obliged to pay the specified amount in the specified currency
      BEFORE the specified (absolute) payment due date — a temporal predicate
      against that date.
  - id: late_fee
    kind: obligation
    clause: "1.5"
    expects: >
      On late payment, Buyer is obliged to pay a late fee equal to the
      specified rate applied to the amount owed — triggered by the payment
      failure.
  - id: suspension
    kind: power
    clause: "1.5"
    expects: >
      On late payment the Seller MAY suspend performance of ALL of its
      obligations under the agreement until amounts owed are received in
      full — discretionary power.
  - id: no_assignment
    kind: state
    clause: "2.1"
    expects: >
      The Buyer may not assign its rights and obligations (a prohibition on
      assignment by the Buyer).
  - id: termination_grace
    kind: power
    clause: "3.1"
    expects: >
      The Buyer is entitled to terminate ONLY when a delivery delay exceeds
      10 days — a buyer termination power gated on the 10-day threshold
      (a delay of 10 days or less confers no termination right).
