# Clause inventory: contracts/Vaccine.txt (curated 2026-08-11).
# Direction on invoicing is the audit's headline trap (the corpus sibling had
# the Government invoicing itself); the order is discretionary ("may
# request"), and Stop-Work is an ABSENCE of authority, not a power.
contract: vaccine
source: contracts/Vaccine.txt
items:
  - id: order_power
    kind: power
    clause: "1.1"
    expects: >
      The Government MAY request production and delivery of doses —
      discretionary power, with each order at least the minimum quantity and
      aggregate orders not exceeding the maximum.
  - id: lead_time
    kind: obligation
    clause: "1.2"
    expects: >
      Upon a request, the Manufacturer is obliged to inform the Government of
      lead times (with a mutually agreed delivery schedule) — triggered by
      the Government's request.
  - id: cold_chain
    kind: state
    clause: "1.3"
    expects: >
      The Manufacturer's cold-chain responsibility CEASES upon delivery (the
      frozen-storage duty does not extend past delivery).
  - id: availability_notice
    kind: obligation
    clause: "1.4"
    expects: >
      The Manufacturer notifies the Government of the date doses become
      available; the Government confirms orders by ship-to location in
      advance of those dates.
  - id: delivery_liability_waiver
    kind: state
    clause: "1.5"
    expects: >
      The Manufacturer has no liability for missing estimated delivery dates
      when the change stems from external risks (regulatory, manufacturing,
      etc.) — a liability exclusion, not an obligation.
  - id: invoice_and_pay
    kind: obligation
    clause: "2.1-2.2"
    expects: >
      The MANUFACTURER invoices the Government (for actual delivered
      quantities, at the unit price, monthly for shipped doses) and the
      GOVERNMENT is obliged to pay each invoice within 30 days of receipt —
      the direction matters (Manufacturer invoices, Government pays) and the
      30-day deadline is enforced by a temporal predicate.
  - id: no_withhold
    kind: state
    clause: "2.3"
    expects: >
      The Government has NO right to withhold payment for delivered doses
      unless the FDA has withdrawn approval — a prohibition with a single
      narrow exception.
  - id: no_stop_work
    kind: state
    clause: "3.1"
    expects: >
      The Government does NOT have authority to issue a Stop-Work Order
      (except as required by law) — the ABSENCE of a power; modeling
      Stop-Work as an exercisable government power contradicts this clause.
  - id: survival
    kind: state
    clause: "3.2"
    expects: >
      Termination or expiration does not release accrued liability —
      including the Government's outstanding payments for doses already
      delivered.
