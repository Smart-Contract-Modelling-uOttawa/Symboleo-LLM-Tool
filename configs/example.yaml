pipeline:
  num_candidates: 1
  max_iterations: 5
  stop_on_first_convergence: false

generation:
  llm:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.7
    max_tokens: 4096
  strategy: zero_shot
  strategy_params: {}
  include_grammar: true

correction:
  llm:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.3
    max_tokens: 4096
  strategy: zero_shot
  strategy_params: {}
  include_grammar: true

symboleo:
  jar_path: ./lib/symboleo-cli-1.0.0-all.jar
  java_executable: java

output:
  directory: ./output
  save_intermediates: false

observability:
  langsmith:
    enabled: false
    project: symboleo-research
