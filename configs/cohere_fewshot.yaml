# yaml-language-server: $schema=schemas/config.schema.json
pipeline:
  num_candidates: 1
  max_iterations: 5
  stop_on_first_convergence: false

generation:
  llm:
    provider: cohere
    model: command-a-03-2025
    temperature: 0.2
    max_tokens: 4096
  strategy: few_shot
  # vaccine_procurement is a non-MeatSale example showing the
  # `role: Type with name := paramP.name` declaration idiom (equipment_loan
  # shows it too). meat_sale must stay excluded while the eval contract is
  # the MeatSale text (leave-one-out).
  strategy_params:
    example_files:
      - vaccine_procurement
  include_grammar: true

correction:
  llm:
    provider: cohere
    model: command-a-03-2025
    temperature: 0.2
    max_tokens: 4096
  # zero_shot, not few_shot — a cost choice: few_shot correction re-sends every
  # configured example on every correction iteration, and this experiment only
  # wants the examples at generation time.
  strategy: zero_shot
  strategy_params: {}
  include_grammar: true

symboleo:
  jar_path: ./lib/symboleo-cli.jar
  java_executable: java

output:
  directory: ./output
  save_intermediates: true

observability:
  langsmith:
    enabled: true
    project: symboleo-research
