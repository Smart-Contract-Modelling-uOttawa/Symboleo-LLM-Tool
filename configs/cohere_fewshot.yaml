pipeline:
  num_candidates: 1
  max_iterations: 5
  stop_on_first_convergence: false

generation:
  llm:
    provider: cohere
    model: command-a-03-2025
    temperature: 0.2
    max_tokens: 4096
  strategy: few_shot
  # vaccine_procurement is the one non-MeatSale example showing the
  # `role: Type with name := paramP.name` declaration idiom. meat_sale must
  # stay excluded while the eval contract is sample_contract.txt (leave-one-out).
  strategy_params:
    example_files:
      - vaccine_procurement
  include_grammar: true

correction:
  llm:
    provider: cohere
    model: command-a-03-2025
    temperature: 0.2
    max_tokens: 4096
  # zero_shot, not few_shot: the few-shot correction prompt renders no examples,
  # so this is the same prompt under its honest name.
  strategy: zero_shot
  strategy_params: {}
  include_grammar: true

symboleo:
  jar_path: ./lib/symboleo-cli.jar
  java_executable: java

output:
  directory: ./output
  save_intermediates: true

observability:
  langsmith:
    enabled: true
    project: symboleo-research
