# Suite config — compare several experiment configs against ONE contract.
#
# Run with:
#   symboleo-tool suite <contract.txt> --config configs/suite_example.yaml
#
# The contract is a CLI argument and must NOT appear in this file. Each
# experiment's `config` is a full PipelineConfig (same shape as example.yaml).
#
# gpt-4o-mini is used throughout: it follows the SymboleoAC grammar closely and
# converges reliably, and needs only OPENAI_API_KEY. A stronger model is not
# automatically better on this constrained-generation task — see CLAUDE.md.

max_concurrency: 2   # candidates running at once across the whole suite (1 = sequential)

experiments:
  - name: zero-shot
    config:
      pipeline:
        num_candidates: 2                # generate two independent candidates
        stop_on_first_convergence: true  # stop this experiment once one converges
      generation:
        # Anchored on first use so the other experiments can reuse it. Note: YAML
        # merge copies the whole sub-tree — to vary a single field you restate the
        # block rather than override one key.
        llm: &mini
          provider: openai
          model: gpt-4o-mini
          temperature: 0.2
        strategy: zero_shot
      correction:
        llm: *mini
        strategy: zero_shot
      output:
        save_intermediates: true         # keep each iteration's .symboleo file

  - name: cot
    config:
      generation:
        llm: *mini
        strategy: cot                     # chain-of-thought generation...
      correction:
        llm: *mini
        strategy: zero_shot               # ...corrected with the plainer strategy
      output:
        save_intermediates: true
