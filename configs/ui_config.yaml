# Frontend UI configuration — served by GET /options, consumed by the frontend.
# Update this file to add/remove models or adjust parameter constraints.
# Order matters: the first model of the first provider seeds the UI form's
# default, so append new providers rather than prepending them.
# Defaults are derived from Pydantic model definitions — do not add defaults here.
# No code change or frontend deploy required.

models:
  openai:
    - gpt-4o
    - gpt-4o-mini
    - gpt-4.1-mini
    # Reasoning models below: leave temperature unset (they reject one;
    # compatibility.py warns). Reasoning tokens count toward max_tokens, and UI
    # runs are pinned to the 4096 default — a run that thinks hard may truncate
    # its contract.
    - gpt-5-nano
    - gpt-5.6-luna
  anthropic:
    - claude-opus-4-8
    - claude-sonnet-4-6
    - claude-haiku-4-5-20251001
  # Dated names only: Cohere retired the undated aliases (command-r, -r-plus)
  # on 2025-09-15, and the pinned LiteLLM map still lists them.
  cohere:
    - command-a-03-2025
    - command-r-08-2024

parameters:
  num_candidates:
    type: integer
    min: 1
    max: 10
  max_iterations:
    type: integer
    min: 1
    max: 20
  max_concurrency:
    type: integer
    min: 1
    max: 8
  temperature:
    type: float
    min: 0.0
    # Cross-provider envelope (matches the LLMConfig validator). Per-provider
    # caps (anthropic: 1.0) are advisory — see llm/compatibility.py.
    max: 2.0
  stop_on_first_convergence:
    type: boolean
  include_grammar:
    type: boolean
  save_intermediates:
    type: boolean
