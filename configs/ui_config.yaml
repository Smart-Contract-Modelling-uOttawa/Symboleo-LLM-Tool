# Frontend UI configuration — served by GET /options, consumed by the frontend.
# Update this file to add/remove models or adjust parameter constraints.
# Defaults are derived from Pydantic model definitions — do not add defaults here.
# No code change or frontend deploy required.

models:
  openai:
    - gpt-4o
    - gpt-4o-mini
  anthropic:
    - claude-opus-4-8
    - claude-sonnet-4-6
    - claude-haiku-4-5-20251001

parameters:
  num_candidates:
    type: integer
    min: 1
    max: 10
  max_iterations:
    type: integer
    min: 1
    max: 20
  max_concurrency:
    type: integer
    min: 1
    max: 8
  temperature:
    type: float
    min: 0.0
    max: 1.0
  stop_on_first_convergence:
    type: boolean
  include_grammar:
    type: boolean
  save_intermediates:
    type: boolean
