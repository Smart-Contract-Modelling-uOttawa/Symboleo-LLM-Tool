name: Python CI

on:
  pull_request:
    paths:
      - 'symboleo_llm_tool/**'
      - 'tests/**'
      # Shipped configs are fenced by tests that read the real files, so a
      # config-only change must still run them. Same for the few-shot corpus,
      # which test_example_corpus.py validates against the JAR.
      - 'configs/**'
      - 'examples/**'
      # The JAR is what tests/integration/ probes. A validator-only refresh
      # touches no other path, and that is exactly the change those tests
      # exist to catch.
      - 'lib/**'
      # Not run by CI, but `ruff check .` covers it repo-wide — without this a
      # scripts-only PR is unlinted and its violation reds the next unrelated PR.
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked asserts uv.lock matches pyproject and fails rather than silently
      # re-resolving, which pins ruff: an unenforced sync could otherwise pull a
      # newer ruff whose version-dependent format output reddens an unrelated PR.
      # mypy deliberately stays unlocked — it runs live in the typecheck job below.
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --locked
      # mypy runs live (latest), not from the lock: a type-checker's drift
      # usually surfaces real bugs worth adopting, unlike a formatter's. --with
      # overlays it on the locked project env so imports and stubs still resolve.
      - run: uv run --no-sync --with mypy mypy symboleo_llm_tool

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --locked
      - run: uv run pytest tests/unit -q --cov=symboleo_llm_tool --cov-report=term-missing

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: uv sync --extra dev --locked
      - run: uv run pytest tests/integration -q -m "not live"
